name: tests

# Runs the test suite on every push to main and on every pull request,
# including PRs from forks. Until this existed, a pull request showed
# "Checks 0" and nothing verified that the code still worked.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    # A run that hangs is stopped here, not after GitHub's six hours
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A test that hangs fails the run and says where (v0.7.10): ten
      # minutes in, `timeout` sends SIGABRT, and Python's faulthandler
      # prints the stack of every thread before the process dies. The
      # whole suite takes a minute or two. v0.7.9's run hung for 19
      # minutes and was cancelled with nothing in the log to say why.
      - name: Run tests
        run: timeout --signal=ABRT 10m python -X faulthandler -m unittest discover -s tests -v
